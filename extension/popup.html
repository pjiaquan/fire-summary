<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Summary</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Fire Summary</h1>
      </header>

      <div class="actions">
        <button id="summarize-button" type="button" data-i18n="popup.copySummary">Copy Summary</button>
        <button id="copy-article-button" type="button" class="secondary" data-i18n="popup.copyArticle">Copy Article</button>
      </div>

      <section class="panel">
        <p id="status" class="status">
          <span class="status-spinner" aria-hidden="true"></span>
          <span class="status-text" data-i18n="popup.waiting">Waiting for action</span>
        </p>
        <h2 id="article-title" class="title"></h2>
        <div id="summary" class="summary empty" data-i18n="popup.noSummaryYet">No summary generated yet.</div>
      </section>

      <button id="open-settings-button" type="button" class="ghost" data-i18n="popup.settings">Settings</button>
      <button id="open-discussion-button" type="button" class="ghost" data-i18n="popup.discussion">Discussion</button>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
