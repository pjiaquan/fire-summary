<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="discussion.title">Fire Summary Discussion</title>
    <link rel="stylesheet" href="discussion.css" />
  </head>
  <body>
    <main class="shell">
      <section class="context-card">
        <p id="context-model" class="meta"></p>
        <h2 id="context-title" class="context-title" data-i18n="discussion.noSummaryLoaded">No summary loaded</h2>
        <p id="context-url" class="context-url"></p>
        <div id="context-summary" class="markdown empty" data-i18n="discussion.summaryNotFound">Summary content not found.</div>
      </section>

      <section id="messages" class="messages"></section>

      <form id="composer" class="composer">
        <label class="composer-label" for="followup-input" data-i18n="discussion.extendedDiscussion">Extended Discussion</label>
        <textarea
          id="followup-input"
          rows="4"
          data-i18n-placeholder="discussion.discussionPlaceholder"
          placeholder="e.g., analyze from engineering risks, product value, and next action perspectives."
        ></textarea>
        <div class="composer-actions">
          <p id="composer-status" class="composer-status" data-i18n="discussion.continueFromSummary">You can continue asking follow-up questions based on the current summary.</p>
          <div class="composer-buttons">
            <button id="export-button" type="button" class="secondary-button" data-i18n="discussion.exportDiscussion">Export Discussion</button>
            <div class="send-button-wrap">
              <button id="send-button" type="submit">
                <span class="button-label" data-i18n="discussion.sendQuestion">Send Question</span>
                <span class="button-spinner" aria-hidden="true"></span>
              </button>
              <span id="send-shortcut-tooltip" class="shortcut-tooltip" role="tooltip" data-i18n="discussion.ctrlEnter">Ctrl + Enter to send</span>
            </div>
          </div>
        </div>
      </form>
    </main>

    <script type="module" src="discussion.js"></script>
  </body>
</html>
